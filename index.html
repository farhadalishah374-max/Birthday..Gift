<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ??</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

<!-- Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff6a88,#ff99ac,#fad0c4);
  text-align:center;
  overflow:hidden;
}

.container{
  padding:20px;
  max-width:400px;
  width:90%;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  animation:fadeIn 2s ease-in-out;
}

h1{
  font-size:28px;
  color:white;
  font-weight:800;
  animation:bounce 2s infinite;
}

p{
  margin:15px 0;
  font-size:16px;
  color:white;
}

button{
  padding:12px 25px;
  border:none;
  border-radius:30px;
  font-size:16px;
  font-weight:600;
  background:white;
  color:#ff4e8a;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
  background:#ffe6f0;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

/* Floating Balloons */
.balloon{
  position:absolute;
  bottom:-150px;
  width:40px;
  height:60px;
  border-radius:50%;
  animation:float 10s infinite ease-in;
}

.balloon::after{
  content:'';
  position:absolute;
  width:2px;
  height:40px;
  background:white;
  left:50%;
  top:60px;
}

@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(-120vh);}
}

/* Responsive */
@media(max-width:480px){
  h1{font-size:22px;}
  p{font-size:14px;}
}
</style>
</head>

<body>

<!-- Balloons -->
<div class="balloon" style="left:10%; background:#ff4e8a;"></div>
<div class="balloon" style="left:30%; background:#ffd93d;"></div>
<div class="balloon" style="left:50%; background:#6bcB77;"></div>
<div class="balloon" style="left:70%; background:#4d96ff;"></div>
<div class="balloon" style="left:90%; background:#ff6b6b;"></div>

<div class="container">
  <h1>?? Happy Birthday! ??</h1>
  <p>May your day be filled with love, laughter, and endless happiness. ?</p>
  <button onclick="celebrate()">Celebrate ??</button>
</div>

<script>
function celebrate(){
  confetti({
    particleCount:150,
    spread:120,
    origin:{y:0.6}
  });
}
</script>

</body>
</html>
